name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - Package.swift
      - Resources/**
      - version.txt

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dmg:
    needs: release-please
    # release-please is skipped on pull requests, so a bare needs would skip this job too.
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Pull requests from forks get no secrets and fall back to ad-hoc signing. A release must never do that, because it would make users grant Screen Recording again.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.CORNERMARK_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CORNERMARK_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            [ "$GITHUB_EVENT_NAME" = pull_request ] && exit 0
            echo "CORNERMARK_CERT_P12 is not set" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # The certificate is self-signed and untrusted, so find-identity -v would hide it.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/\)/ { print $2; exit }')"
          echo "CORNERMARK_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build the DMG
        run: scripts/build-dmg.sh
      - name: Show the signing requirement
        run: codesign -d -r- build/Cornermark.app
      - name: Upload the DMG as a workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Cornermark-dmg
          path: build/Cornermark.dmg
          retention-days: 7
      - name: Attach the DMG to the release
        if: github.event_name == 'push'
        run: gh release upload "$TAG" build/Cornermark.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
