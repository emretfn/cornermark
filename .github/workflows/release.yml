name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - Package.swift
      - Resources/**
      - version.txt

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dmg:
    needs: release-please
    # release-please is skipped on pull requests, so a bare needs would skip this job too.
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' ||
      (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the DMG
        run: scripts/build-dmg.sh
        env:
          CORNERMARK_SIGN_IDENTITY: "-"
      - name: Upload the DMG as a workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Cornermark-dmg
          path: build/Cornermark.dmg
          retention-days: 7
      - name: Attach the DMG to the release
        if: github.event_name == 'push'
        run: gh release upload "$TAG" build/Cornermark.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
